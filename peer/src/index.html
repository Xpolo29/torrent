<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peer2Peer File Sharing Application</title>
  <script type="module" src="/main.js" defer></script>
  <style>
    .logo.vanilla:hover {
      filter: drop-shadow(0 0 2em #ffe21c);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Peer2Peer File Sharing Application</h1>

    <!-- Dashboard -->
    <div id="appDashboard" class="dashboard" style="margin-bottom: 15px;"></div>

    <div id="actions">
      <!-- Upload File Button -->
      <button id="uploadButton">Upload Files</button>

      <!-- Search File Button and Form -->
      <button id="searchButton">Search File to Download</button>

      <div id="searchForm" style="display: none;">
        <input type="text" id="fileNameSearchForm" placeholder="Enter file name">
        <input type="text" id="fileSizeSearchForm" placeholder="Enter file size">
        <button id="submitSearchForm">Submit</button>
      </div>
    </div>

  </div>
</body>

</html>
