[package]
name = "client"
version = "0.1.0"
description = "Peer2Peer File Sharing Application"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1", features = [] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
env_logger = "0.11.3"
hashbrown = "0.14.3"
hex = "0.4.3"
lazy_static = "1.4.0"
log = "0.4.21"
md-5 = "0.10.6"
num-traits = "0.2.18"
regex = "1.10.4"
rust-ini = "0.21.0"
simplelog = "0.12.2"
tauri = { version = "1", features = ["shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# [[bin]]
# name = "testo"
# path = "src/testo.rs"

