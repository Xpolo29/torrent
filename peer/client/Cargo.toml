[package]
name = "client"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
env_logger = "0.11.3"
log = "0.4.21"
regex = "1.10.4"
simplelog = "0.12.2"

# for data base
sqlx = { version = "0.5.9", features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["full"] }

# for hash - md5
tempfile = "3.2.0"